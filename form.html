<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Seeds Practice - Entry Form</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2 rounded-xl flex items-center justify-center w-10 h-10 shadow-md">
                    🌱
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900">Seeds Practice</h1>
                    <p class="text-xs text-slate-500">Daily Journal & Tracking Form</p>
                </div>
            </div>
            <!-- User Profile & Logout -->
            <div id="userProfile" class="flex items-center space-x-3">
                <img id="userAvatar" src="" alt="User Avatar" class="w-9 h-9 rounded-full border border-slate-200 hidden">
                <span id="userName" class="text-sm font-medium text-slate-700 hidden"></span>
                <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg border border-slate-200 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Sign Out
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Form -->
    <main class="flex-grow max-w-3xl w-full mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
            <div class="border-b border-slate-100 pb-4 mb-6">
                <h2 class="text-xl font-bold text-slate-900">New Journal Entry</h2>
                <p class="text-xs text-slate-500 mt-1">Record your daily seeds practice log and attach relevant files.</p>
            </div>

            <form id="seedsForm" class="space-y-6">
                <!-- Title / Date -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Date</label>
                        <input type="date" id="entryDate" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
                        <select id="entryCategory" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Daily Practice">Daily Practice</option>
                            <option value="Reflection">Reflection</option>
                            <option value="Goal Setting">Goal Setting</option>
                        </select>
                    </div>
                </div>

                <!-- Notes / Journal Entry -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Journal Notes</label>
                    <textarea id="entryNotes" rows="4" placeholder="Write down your seeds practice reflections..." required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>

                <!-- File Attachment Section -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Attachment (Image or Small Doc)</label>
                    <input type="file" id="fileInput" accept="image/*,.pdf,.txt" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer border border-slate-200 rounded-lg p-1">
                    <p class="text-[10px] text-slate-400 mt-1">Converts to Base64 to store in localStorage (Keep under ~2MB).</p>
                </div>

                <!-- Preview Area for Attachment -->
                <div id="filePreviewContainer" class="hidden p-3 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2 truncate">
                        <i class="fa-solid fa-paperclip text-emerald-600"></i>
                        <span id="fileNameDisplay" class="truncate font-medium text-slate-700"></span>
                    </div>
                    <button type="button" onclick="removeAttachment()" class="text-red-500 hover:text-red-700 font-semibold px-2">Remove</button>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end">
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-sm flex items-center space-x-2">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Save Entry</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Saved Entries List -->
        <div class="mt-8">
            <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center justify-between">
                <span>Saved Entries</span>
                <span id="entryCount" class="text-xs font-normal text-slate-500 bg-slate-200 px-2 py-0.5 rounded-full">0 entries</span>
            </h3>
            <div id="entriesList" class="space-y-4"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-8">
        Seeds Practice &copy; 2026. All rights reserved.
    </footer>

    <!-- Script Handling Authentication & Base64 File Storage -->
    <script>
        let currentBase64File = null;
        let currentFileName = null;

        // On Page Load: Check Authentication State & Load Saved Entries
        window.onload = function() {
            if (localStorage.getItem('is_logged_in') !== 'true') {
                window.location.href = "index.html";
                return;
            }

            // Populate User Information from Login Session
            const userEmail = localStorage.getItem('user_email');
            const userName = localStorage.getItem('user_name');
            const userPicture = localStorage.getItem('user_picture');

            if (userName) {
                const nameSpan = document.getElementById('userName');
                nameSpan.innerText = userName;
                nameSpan.classList.remove('hidden');
            }
            if (userPicture) {
                const avatarImg = document.getElementById('userAvatar');
                avatarImg.src = userPicture;
                avatarImg.classList.remove('hidden');
            }

            // Set default date to today
            document.getElementById('entryDate').valueAsDate = new Date();

            // Render existing entries
            renderEntries();
        };

        // File Input Listener: Convert uploaded file to Base64 String
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Warn if file is larger than 2.5MB to avoid localStorage overflow
            if (file.size > 2.5 * 1024 * 1024) {
                alert("File size is too large for local browser storage. Please select a file under 2.5MB.");
                this.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                currentBase64File = event.target.result;
                currentFileName = file.name;

                // Update UI preview
                document.getElementById('fileNameDisplay').innerText = file.name;
                document.getElementById('filePreviewContainer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        // Remove Attachment Function
        function removeAttachment() {
            currentBase64File = null;
            currentFileName = null;
            document.getElementById('fileInput').value = "";
            document.getElementById('filePreviewContainer').classList.add('hidden');
        }

        // Form Submission Listener
        document.getElementById('seedsForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const entry = {
                id: Date.now(),
                date: document.getElementById('entryDate').value,
                category: document.getElementById('entryCategory').value,
                notes: document.getElementById('entryNotes').value,
                fileName: currentFileName,
                fileData: currentBase64File,
                userEmail: localStorage.getItem('user_email') || 'Unknown User'
            };

            // Get existing entries from localStorage
            let entries = JSON.parse(localStorage.getItem('seeds_entries') || '[]');
            entries.unshift(entry); // Add new entry to the top

            try {
                localStorage.setItem('seeds_entries', JSON.stringify(entries));
                alert("Entry and attachment saved successfully!");

                // Reset Form
                document.getElementById('seedsForm').reset();
                document.getElementById('entryDate').valueAsDate = new Date();
                removeAttachment();

                // Refresh UI
                renderEntries();
            } catch (err) {
                console.error("Storage Error:", err);
                alert("Failed to save entry. Browser storage quota may be full.");
            }
        });

        // Render Entries to the UI
        function renderEntries() {
            const container = document.getElementById('entriesList');
            const entries = JSON.parse(localStorage.getItem('seeds_entries') || '[]');
            document.getElementById('entryCount').innerText = `${entries.length} entries`;

            if (entries.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No journal entries saved yet.</p>`;
                return;
            }

            container.innerHTML = entries.map(item => `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-2">
                    <div class="flex items-center justify-between text-xs text-slate-500">
                        <span class="font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">${item.category}</span>
                        <span>${item.date}</span>
                    </div>
                    <p class="text-sm text-slate-800 whitespace-pre-wrap">${item.notes}</p>

                    ${item.fileData ? `
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                            <span class="text-slate-500 truncate"><i class="fa-solid fa-paperclip text-emerald-600 mr-1"></i>${item.fileName}</span>
                            <a href="${item.fileData}" download="${item.fileName}" class="text-emerald-600 hover:text-emerald-800 font-medium">Download Attachment</a>
                        </div>
                    ` : ''}

                    <div class="pt-2 flex justify-end">
                        <button onclick="deleteEntry(${item.id})" class="text-[11px] text-red-500 hover:text-red-700">Delete Entry</button>
                    </div>
                </div>
            `).join('');
        }

        // Delete an entry by ID
        function deleteEntry(id) {
            if (!confirm("Are you sure you want to delete this entry?")) return;
            let entries = JSON.parse(localStorage.getItem('seeds_entries') || '[]');
            entries = entries.filter(item => item.id !== id);
            localStorage.setItem('seeds_entries', JSON.stringify(entries));
            renderEntries();
        }

        // Sign Out Function
        function logout() {
            localStorage.removeItem('is_logged_in');
            localStorage.removeItem('user_email');
            localStorage.removeItem('user_name');
            localStorage.removeItem('user_picture');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
