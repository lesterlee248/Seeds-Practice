<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeds Planting Portal - Collection Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-xs text-slate-700 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="choose.html" id="backHubLink" class="text-slate-500 hover:text-emerald-600 transition text-xs font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back to Hub
                </a>
            </div>
            <div class="flex items-center gap-3">
                <span id="user-email-display" class="text-[11px] font-medium text-slate-600 bg-slate-100 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-[11px] text-rose-600 hover:text-rose-700 font-semibold">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 py-6">
        <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-slate-100 p-5 sm:p-7">
            <div class="text-center mb-5">
                <h2 class="text-lg font-bold text-slate-900">Seeds Planting Portal</h2>
                <p class="text-[11px] text-slate-500 mt-0.5">Record your daily spiritual, emotional, and practical growth seeds.</p>
            </div>

            <form id="practiceForm" autocomplete="off" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-emerald-700 mb-2">What practice would you like to submit?</label>
                    <div class="flex flex-col gap-1.5 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="3 Times Book" class="w-3.5 h-3.5 text-emerald-600 rounded"> 3 Times Book
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Gratitude" class="w-3.5 h-3.5 text-emerald-600 rounded"> Gratitude
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Rejoices" class="w-3.5 h-3.5 text-emerald-600 rounded"> Rejoices
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Coffee Celebration" class="w-3.5 h-3.5 text-emerald-600 rounded"> Coffee Celebration
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Pen Story" class="w-3.5 h-3.5 text-emerald-600 rounded"> Pen Story
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Moon and Lake Sadhana" class="w-3.5 h-3.5 text-emerald-600 rounded"> Moon and Lake Sadhana
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Meditation" class="w-3.5 h-3.5 text-emerald-600 rounded"> Meditation
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Yoga" class="w-3.5 h-3.5 text-emerald-600 rounded"> Yoga
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Job seeds" class="w-3.5 h-3.5 text-emerald-600 rounded"> Job seeds
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Relationship seeds" class="w-3.5 h-3.5 text-emerald-600 rounded"> Relationship seeds
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Money seeds" class="w-3.5 h-3.5 text-emerald-600 rounded"> Money seeds
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Study / Learning" class="w-3.5 h-3.5 text-emerald-600 rounded"> Study / Learning
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="ACI 07" class="w-3.5 h-3.5 text-emerald-600 rounded"> ACI 07
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="BDSW" class="w-3.5 h-3.5 text-emerald-600 rounded"> BDSW
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="Chanting" class="w-3.5 h-3.5 text-emerald-600 rounded"> Chanting
                        </label>
                        <label class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer bg-white px-3 py-1.5 rounded-lg border border-slate-200 hover:border-emerald-400 transition">
                            <input type="checkbox" name="practice" value="以果为道" class="w-3.5 h-3.5 text-emerald-600 rounded"> 以果为道
                        </label>
                    </div>
                </div>

                <div>
                    <label for="other-practice" class="block text-[11px] font-semibold text-slate-700 mb-1">Other Practice:</label>
                    <input type="text" id="other-practice" name="other_practice" autocomplete="off" placeholder="Specify other practice" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="date" class="block text-[11px] font-semibold text-slate-700 mb-1">Date</label>
                        <input type="date" id="date" name="date" required class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="time" class="block text-[11px] font-semibold text-slate-700 mb-1">Time</label>
                        <input type="time" id="time" name="time" required class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label for="record" class="block text-[11px] font-semibold text-slate-700 mb-1">Record the Practice</label>
                    <textarea id="record" name="record_practice_1" rows="3" required placeholder="Write down your session details or reflections..." class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Upload Document (Optional, Max 50 MB)</label>
                    <div class="border border-dashed border-emerald-400 bg-emerald-50/50 p-3 text-center rounded-xl cursor-pointer hover:bg-emerald-50 transition" onclick="document.getElementById('file-upload').click()">
                        <span id="file-label" class="text-[11px] text-emerald-700 font-medium">Click to select document or image</span>
                        <input type="file" id="file-upload" name="document_upload" accept=".docx,.doc,image/*,.pdf,.txt" style="display:none;" onchange="updateFileName(this)">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-1">Rate your happy emotions for this moment:</label>
                    <div class="flex justify-between bg-slate-50 p-2 rounded-xl border border-slate-200">
                        <label class="flex flex-col items-center text-[11px] font-bold text-slate-600 cursor-pointer px-3 py-0.5">1 <input type="radio" name="happiness_rating" value="1" class="mt-1"></label>
                        <label class="flex flex-col items-center text-[11px] font-bold text-slate-600 cursor-pointer px-3 py-0.5">2 <input type="radio" name="happiness_rating" value="2" class="mt-1"></label>
                        <label class="flex flex-col items-center text-[11px] font-bold text-slate-600 cursor-pointer px-3 py-0.5">3 <input type="radio" name="happiness_rating" value="3" class="mt-1"></label>
                        <label class="flex flex-col items-center text-[11px] font-bold text-slate-600 cursor-pointer px-3 py-0.5">4 <input type="radio" name="happiness_rating" value="4" class="mt-1"></label>
                        <label class="flex flex-col items-center text-[11px] font-bold text-emerald-600 cursor-pointer px-3 py-0.5">5 <input type="radio" name="happiness_rating" value="5" checked class="mt-1"></label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md shadow-emerald-600/20">
                    Submit Practice Record
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-3 text-center text-[11px] text-slate-400">
        Seeds Planting Portal &copy; 2026. All rights reserved.
    </footer>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydnhSIpLo1wLEe66mbTTaQDtKfTUexIj-A6OMSjSbInef70uw2rpy0msRHCf76Tc3SqQ/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const activeEmail = urlParams.get('email') || localStorage.getItem('user_email') || '';

        window.onload = function() {
            if (activeEmail) {
                localStorage.setItem('user_email', activeEmail);
                localStorage.setItem('is_logged_in', 'true');
                document.getElementById('user-email-display').textContent = activeEmail;
                document.getElementById('backHubLink').href = `choose.html?email=${encodeURIComponent(activeEmail)}`;
            } else {
                document.getElementById('user-email-display').textContent = 'Not signed in';
            }
            setNowDateTime();
        };

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        function setNowDateTime() {
            const now = new Date();
            document.getElementById('date').value = now.toLocaleDateString('sv-SE');
            document.getElementById('time').value = now.toTimeString().substring(0, 5);
        }

        function updateFileName(input) {
            const label = document.getElementById('file-label');
            if (input.files.length > 0) {
                label.textContent = "Selected: " + input.files[0].name;
                label.style.color = "#059669";
            } else {
                label.textContent = "Click to select document or image";
                label.style.color = "inherit";
            }
        }

        document.getElementById('practiceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "Submitting...";
            submitBtn.disabled = true;

            const fileInput = document.getElementById('file-upload');
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64Data = evt.target.result.split(',')[1];
                    sendData({
                        fileName: file.name,
                        mimeType: file.type || 'application/octet-stream',
                        fileData: base64Data
                    });
                };
                reader.readAsDataURL(file);
            } else {
                sendData(null);
            }

            function sendData(fileObject) {
                const selectedPractices = Array.from(document.querySelectorAll('input[name="practice"]:checked'))
                                               .map(cb => cb.value)
                                               .join(', ');

                const formData = {
                    userEmail: activeEmail || localStorage.getItem('user_email') || "",
                    practices: selectedPractices,
                    otherPractice: document.getElementById('other-practice').value.trim(),
                    date: document.getElementById('date').value,
                    time: document.getElementById('time').value,
                    record: document.getElementById('record').value,
                    rating: document.querySelector('input[name="happiness_rating"]:checked')?.value || '5',
                    file: fileObject
                };

                fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(formData)
                })
                .then(() => {
                    alert("Practice record submitted successfully!");
                    document.getElementById('practiceForm').reset();
                    updateFileName(fileInput);
                    setNowDateTime();
                    submitBtn.textContent = "Submit Practice Record";
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error("Error!", error);
                    alert("Submission failed. Please try again.");
                    submitBtn.textContent = "Submit Practice Record";
                    submitBtn.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
