<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Seeds Practice - Login</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2 rounded-xl flex items-center justify-center w-10 h-10 shadow-md">
                    🌱
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-slate-900">Seeds Practice</h1>
                    <p class="text-xs text-slate-500">Authentication Portal</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Login Card -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center">
            <div class="mb-6">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-100 shadow-sm">
                    <i class="fa-solid fa-user-lock text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Welcome Back</h2>
                <p class="text-slate-500 text-sm mt-1">Please sign in with Google to access the form.</p>
            </div>

            <!-- Real Google Identity Services Button -->
            <div class="flex justify-center mb-6">
                <div id="buttonDiv"></div>
            </div>

            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-left text-xs text-slate-600">
                <p class="font-semibold text-slate-800 mb-1"><i class="fa-solid fa-info-circle text-emerald-600"></i> Setup Instructions:</p>
                <p>Replace <code class="bg-slate-200 px-1 py-0.5 rounded text-slate-800">YOUR_CLIENT_ID.apps.googleusercontent.com</code> in this file with your OAuth Client ID from Google Cloud Console.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Seeds Practice &copy; 2026. All rights reserved.
    </footer>

    <!-- Google Sign-In Script -->
    <script>
        // Check if user is already logged in; if so, redirect immediately
        if (localStorage.getItem('is_logged_in') === 'true') {
            window.location.href = "form.html";
        }

        // Callback function triggered when Google finishes sign-in
        function handleCredentialResponse(response) {
            try {
                // Decode the JWT token payload
                const payload = parseJwt(response.credential);

                // Save required session variables to localStorage
                localStorage.setItem('user_email', payload.email);
                localStorage.setItem('user_name', payload.name);
                localStorage.setItem('user_picture', payload.picture || '');
                localStorage.setItem('is_logged_in', 'true');

                // Redirect to form.html
                window.location.href = "form.html";
            } catch (error) {
                console.error("Authentication Error:", error);
                alert("Failed to decode login token.");
            }
        }

        // Decode JWT token safely
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Initialize Google Sign-In button on window load
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "700133534894-nr0264802331kkckupgmc4mrd9tdrvp3.apps.googleusercontent.com", // Replace with your actual Client ID
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", text: "signin_with", width: 280, shape: "pill" }
            );
        };
    </script>
</body>
</html>
