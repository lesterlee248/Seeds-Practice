<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeds Planting Portal - View Records</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-sm text-slate-700 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="choose.html" id="backHubLink" class="text-slate-500 hover:text-emerald-600 transition text-xs font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back to Hub
                </a>
            </div>
            <div class="flex items-center gap-3">
                <a href="form.html" id="addNewLink" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition shadow-sm">
                    <i class="fa-solid fa-plus mr-1"></i> Add New
                </a>
                <span id="user-email-display" class="text-xs font-medium text-slate-600 bg-slate-100 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-xs text-rose-600 hover:text-rose-700 font-semibold">Sign Out</button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto p-4 sm:p-6">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-5 sm:p-6">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between mb-5 pb-4 border-b border-slate-100 gap-3">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Seeds Planting Portal - Directory</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Browse and filter your logged practices and reflections.</p>
                </div>

                <!-- Filter & Search Controls -->
                <div class="flex flex-wrap items-center justify-end gap-2">
                    <!-- Practice Dropdown -->
                    <select id="practiceFilter" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-white text-slate-700 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">All Practices</option>
                        <option value="3 Times Book">3 Times Book</option>
                        <option value="Gratitude">Gratitude</option>
                        <option value="Rejoices">Rejoices</option>
                        <option value="Coffee Celebration">Coffee Celebration</option>
                        <option value="Pen Story">Pen Story</option>
                        <option value="Moon and Lake Sadhana">Moon and Lake Sadhana</option>
                        <option value="Meditation">Meditation</option>
                        <option value="Yoga">Yoga</option>
                        <option value="Job seeds">Job seeds</option>
                        <option value="Relationship seeds">Relationship seeds</option>
                        <option value="Money seeds">Money seeds</option>
                        <option value="Study / Learning">Study / Learning</option>
                        <option value="ACI 07">ACI 07</option>
                        <option value="BDSW">BDSW</option>
                        <option value="Chanting">Chanting</option>
                        <option value="以果为道">以果为道</option>
                    </select>

                    <!-- Rating Dropdown -->
                    <select id="ratingFilter" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-white text-slate-700 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <option value="">All Ratings</option>
                        <option value="5">Rating: 5</option>
                        <option value="4">Rating: 4</option>
                        <option value="3">Rating: 3</option>
                        <option value="2">Rating: 2</option>
                        <option value="1">Rating: 1</option>
                    </select>

                    <!-- Date Filter -->
                    <input type="date" id="dateFilter" title="Filter by date" class="px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-white text-slate-700 focus:ring-2 focus:ring-emerald-500 focus:outline-none">

                    <!-- Search Bar -->
                    <div class="relative w-full sm:w-48">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 text-[11px] absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="text" id="searchInput" placeholder="Search records..." class="pl-8 pr-3 py-1.5 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none w-full">
                    </div>

                    <!-- Clear Filters Button -->
                    <button type="button" id="resetFiltersBtn" onclick="resetFilters()" class="hidden px-2.5 py-1.5 text-xs font-semibold text-slate-500 hover:text-rose-600 transition">
                        Reset
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-[11px]">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 border-b border-slate-200">
                            <th class="p-2.5 font-semibold">Date & Time</th>
                            <th class="p-2.5 font-semibold">Practices</th>
                            <th class="p-2.5 font-semibold">Record Details</th>
                            <th class="p-2.5 font-semibold text-center">Rating</th>
                            <th class="p-2.5 font-semibold">Attachment</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody" class="divide-y divide-slate-100 text-slate-700">
                        <tr>
                            <td colspan="5" class="p-5 text-center text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Connecting to your database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-400">
        Seeds Planting Portal &copy; 2026. All rights reserved.
    </footer>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydnhSIpLo1wLEe66mbTTaQDtKfTUexIj-A6OMSjSbInef70uw2rpy0msRHCf76Tc3SqQ/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const activeEmail = urlParams.get('email') || localStorage.getItem('user_email') || '';
        let allRecords = [];

        window.onload = function() {
            if (activeEmail) {
                localStorage.setItem('user_email', activeEmail);
                localStorage.setItem('is_logged_in', 'true');
                document.getElementById('user-email-display').textContent = activeEmail;
                document.getElementById('backHubLink').href = `choose.html?email=${encodeURIComponent(activeEmail)}`;
                document.getElementById('addNewLink').href = `form.html?email=${encodeURIComponent(activeEmail)}`;
            } else {
                document.getElementById('user-email-display').textContent = 'Guest';
            }
            fetchRecords(activeEmail);
        };

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        function renderRecords(records) {
            const tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = '';

            if (!records || records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-5 text-center text-slate-400">No matching practice records found.</td></tr>`;
                return;
            }

            records.forEach(row => {
                const combinedPractices = [row.practices, row.otherPractice].filter(Boolean).join(', ') || '—';
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-2.5 whitespace-nowrap font-medium text-slate-900">${row.date || ''} ${row.time || ''}</td>
                    <td class="p-2.5">${combinedPractices}</td>
                    <td class="p-2.5 max-w-xs truncate" title="${row.record || ''}">${row.record || '—'}</td>
                    <td class="p-2.5 text-center font-bold text-emerald-600">${row.rating || '5'}</td>
                    <td class="p-2.5">${row.fileName ? `<a href="${row.fileUrl}" target="_blank" class="text-emerald-600 hover:underline"><i class="fa-solid fa-paperclip mr-1"></i>${row.fileName}</a>` : '<span class="text-slate-400">None</span>'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedPractice = document.getElementById('practiceFilter').value.toLowerCase();
            const selectedRating = document.getElementById('ratingFilter').value;
            const selectedDate = document.getElementById('dateFilter').value;

            // Show "Reset" button whenever any filter is active
            const hasActiveFilter = query || selectedPractice || selectedRating || selectedDate;
            document.getElementById('resetFiltersBtn').classList.toggle('hidden', !hasActiveFilter);

            const filtered = allRecords.filter(row => {
                const combinedPractices = [row.practices, row.otherPractice].filter(Boolean).join(', ').toLowerCase();
                const matchesSearch = !query ||
                    (row.date || '').toLowerCase().includes(query) ||
                    combinedPractices.includes(query) ||
                    (row.record || '').toLowerCase().includes(query);

                const matchesPractice = !selectedPractice || combinedPractices.includes(selectedPractice);
                const matchesRating = !selectedRating || String(row.rating || '').trim() === selectedRating;
                const matchesDate = !selectedDate || (row.date || '').trim() === selectedDate;

                return matchesSearch && matchesPractice && matchesRating && matchesDate;
            });

            renderRecords(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('practiceFilter').value = '';
            document.getElementById('ratingFilter').value = '';
            document.getElementById('dateFilter').value = '';
            applyFilters();
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('practiceFilter').addEventListener('change', applyFilters);
        document.getElementById('ratingFilter').addEventListener('change', applyFilters);
        document.getElementById('dateFilter').addEventListener('change', applyFilters);

        function fetchRecords(email) {
            const tbody = document.getElementById('recordsTableBody');
            
            fetch(`${GOOGLE_APPS_SCRIPT_URL}?email=${encodeURIComponent(email)}`)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP error! Status: ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    allRecords = Array.isArray(data) ? data : (data.records || data.data || []);
                    applyFilters();
                })
                .catch(err => {
                    console.error("Error fetching records:", err);
                    tbody.innerHTML = `<tr><td colspan="5" class="p-5 text-center text-rose-500">
                        Could not load records (${err.message}). Make sure <strong>doGet(e)</strong> is deployed as a <strong>New Version</strong> in Google Apps Script with access set to <strong>Anyone</strong>.
                    </td></tr>`;
                });
        }
    </script>
</body>
</html>
